name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest --cov --cov-report=term
      - name: Restore the benchmarks of the previous run on main
        uses: actions/cache/restore@v4
        with:
          path: .benchmarks
          key: benchmarks-${{ github.sha }}
          restore-keys: benchmarks-
      - name: Benchmarks (fail if 50 % slower than the previous run)
        run: |
          CMP=""
          if ls .benchmarks/*/*.json > /dev/null 2>&1; then
            CMP="--benchmark-compare --benchmark-compare-fail=mean:50%"
          fi
          uv run pytest tests/test_benchmarks.py --benchmark-enable --benchmark-only \
            --benchmark-autosave --benchmark-columns=min,mean,median,max,rounds $CMP
      - name: Keep these benchmarks for the next run
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .benchmarks
          key: benchmarks-${{ github.sha }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t findex .
      - name: Run it with INDEX_PATH and check the endpoints
        run: |
          docker run -d --name findex -p 8000:8000 -e INDEX_PATH=/app/index.bin findex
          for i in $(seq 1 60); do
            if curl -fs localhost:8000/health; then break; fi
            sleep 1
          done
          echo
          curl -fs "localhost:8000/search?q=assignment+expressions&k=3" | python3 -m json.tool | head -20
          curl -fs "localhost:8000/search?q=put+variables+straight+into+text+literals&mode=hybrid&k=5" \
            | python3 -c "import json,sys; print([h['title'] for h in json.load(sys.stdin)['hits']])"
          curl -fs -o /dev/null -w "page: %{http_code}\n" "localhost:8000/?q=walrus"
          test "$(docker exec findex id -u)" != "0"
          docker logs findex
