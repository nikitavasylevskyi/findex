name: Tags and release

# Lab commits are named "Lab N: ..."; the last one of each lab gets the lab-0N tag.
# When the version in pyproject.toml has no vX.Y.Z tag yet, the wheel is built
# and published as a GitHub Release.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Lab tags
        # lab-0N points at the last "Lab N:" commit, so follow-up fixes of a lab move its tag
        run: |
          declare -A last
          while read -r sha subject; do
            if [[ "$subject" =~ ^Lab\ ([0-9]+): ]]; then
              last[$(printf 'lab-%02d' "${BASH_REMATCH[1]}")]=$sha
            fi
          done < <(git log --reverse --format='%H %s')
          for tag in "${!last[@]}"; do
            if [[ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" != "${last[$tag]}" ]]; then
              git tag -f "$tag" "${last[$tag]}"
              git push -f origin "refs/tags/$tag"
            fi
          done

      - name: Release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already released"
            exit 0
          fi
          uv build
          gh release create "v$version" dist/*.whl dist/*.tar.gz \
            --target "$GITHUB_SHA" --title "findex $version" --generate-notes
