name: Tags and release

# Lab commits are named "Lab N: ..."; each gets a lab-0N tag.
# When the version in pyproject.toml has no vX.Y.Z tag yet, the wheel is built
# and published as a GitHub Release.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Lab tags
        run: |
          git log --reverse --format='%H %s' | while read -r sha subject; do
            if [[ "$subject" =~ ^Lab\ ([0-9]+): ]]; then
              tag=$(printf 'lab-%02d' "${BASH_REMATCH[1]}")
              if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                git tag "$tag" "$sha"
                git push origin "$tag"
              fi
            fi
          done

      - name: Release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already released"
            exit 0
          fi
          uv build
          gh release create "v$version" dist/*.whl dist/*.tar.gz \
            --target "$GITHUB_SHA" --title "findex $version" --generate-notes
