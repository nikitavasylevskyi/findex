<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}findex{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='6.5' cy='6.5' r='4.5' fill='none' stroke='%232f5d8a' stroke-width='2'/><path d='M10 10l4 4' stroke='%232f5d8a' stroke-width='2'/></svg>">
</head>
<body>
  <header class="top">
    <a class="logo" href="/">find<span>ex</span></a>
    <form class="search" action="/" method="get" role="search">
      <input type="search" name="q" value="{{ q }}" placeholder="Пошук у PEP і документації Python" aria-label="Запит" autofocus>
      <select name="scorer" aria-label="Ранжування">
        <option value="bm25" {% if scorer != 'tfidf' %}selected{% endif %}>BM25</option>
        <option value="tfidf" {% if scorer == 'tfidf' %}selected{% endif %}>TF-IDF</option>
      </select>
      <button type="submit">Шукати</button>
    </form>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>findex — пошук по PEP і документації CPython · <a href="/api">API</a> · <a href="https://github.com/nikitavasylevskyi/findex">GitHub</a></footer>
</body>
</html>
